<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#15171a" />
    <title>Archtec</title>
    <script>
      // Aplica o tema salvo antes do primeiro paint para evitar o flash do tema errado
      (function () {
        var theme = "dark";
        try {
          var saved = JSON.parse(localStorage.getItem("archtec-theme") || "null");
          if (saved && saved.state && saved.state.theme) theme = saved.state.theme;
        } catch (e) {}
        document.documentElement.classList.add(theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
